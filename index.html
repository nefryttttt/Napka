<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napka</title>
  
  <!-- Favicon -->
  <link rel="icon" href="https://raw.githubusercontent.com/nefryttttt/Napka/main/uploads/favicon.png" type="image/png">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121316;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }
 
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 2px solid #5865f2;
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    /* Card */
    .card {
      background: #1a1b1e;
      border: 1px solid #2c2e33;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #ffffff;
    }
    
    /* Dropzone */
    .drop-zone {
      border: 2px dashed #3b3e45;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #141517;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #5865f2;
      background: #18191c;
    }
    .drop-zone p {
      color: #909296;
      font-size: 15px;
    }

    .status-text {
      margin-top: 15px;
      font-size: 14px;
      color: #909296;
      text-align: center;
    }
    
    .result-input {
      width: 100%;
      background: #141517;
      border: 1px solid #373a40;
      color: #5865f2;
      padding: 10px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    .result-input:hover {
      border-color: #5865f2;
    }

    /* Media Preview */
    .preview-container {
      margin-top: 15px;
      text-align: center;
    }
    .preview-img, .preview-video {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      border: 1px solid #373a40;
      object-fit: contain;
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
    }
    .footer a {
      color: #909296;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover {
      color: #5865f2;
      text-decoration: underline;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <a href="#" class="brand">
        <img src="https://raw.githubusercontent.com/nefryttttt/Napka/main/uploads/logo.png" alt="logo">
        <span>Napka</span>
      </a>
    </header>

    <!-- Main Card -->
    <main class="card">
      <h1 class="title">Upload files</h1>
      
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>Drop image or video here or click to browse</p>
      </div>
      
      <input type="file" id="fileInput" accept="image/*,video/*" class="hidden" onchange="handleFile(this.files[0])">

      <div id="status" class="status-text"></div>
      <div id="result"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <a href="https://github.com/nefryttttt/Napka" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script>
    const API_URL = 'https://napka-api.vercel.app/api/upload';
    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) handleFile(files[0]);
    });

    async function handleFile(file) {
      if (!file) return;

      const status = document.getElementById('status');
      const result = document.getElementById('result');
      result.innerHTML = '';

      // Установлен лимит 3 МБ для стабильной работы с бэкендом Vercel
      const MAX_SIZE = 3 * 1024 * 1024;
      if (file.size > MAX_SIZE) {
        status.innerText = 'Error: File is too large (max 3MB limit)';
        return;
      }

      status.innerText = 'Uploading...';

      const reader = new FileReader();

      reader.onload = async () => {
        try {
          const base64Content = reader.result.split(',')[1];
          const ext = file.name.split('.').pop();
          const filename = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;

          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: filename,
              content: base64Content
            })
          });

          let data;
          try {
            data = await res.json();
          } catch (e) {
            throw new Error('Server response error');
          }

          if (res.ok && data.url) {
            status.innerText = 'Upload complete!';
            
            navigator.clipboard.writeText(data.url).catch(() => {});

            const isVideo = file.type.startsWith('video/');
            const previewHTML = isVideo 
              ? `<video src="${data.url}" class="preview-video" controls autoplay muted loop></video>`
              : `<img src="${data.url}" class="preview-img" alt="Uploaded preview">`;

            result.innerHTML = `
              <input type="text" class="result-input" value="${data.url}" readonly onclick="navigator.clipboard.writeText(this.value); const s=document.getElementById('status'); s.innerText='Link copied!'; setTimeout(()=>s.innerText='Upload complete!', 2000);" title="Click to copy link">
              <div class="preview-container">
                ${previewHTML}
              </div>
            `;
          } else {
            status.innerText = 'Error: ' + (data.error || 'Failed to upload');
          }
        } catch (err) {
          status.innerText = 'Error: ' + err.message;
        }
      };

      reader.onerror = () => {
        status.innerText = 'Error reading file';
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
