<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napka</title>

  <link rel="icon" href="https://raw.githubusercontent.com/nefryttttt/Napka/main/uploads/favicon.png" type="image/png">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121316;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Подняли меню выше за счет flex-start и отступа сверху */
      justify-content: flex-start;
      padding-top: 8vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }

    /* Шапка */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 2px solid #5865f2;
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }
    /* Стили для логотипа (картинки вместо молнии) */
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    /* Карточка загрузки */
    .card {
      background: #1a1b1e;
      border: 1px solid #2c2e33;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #ffffff;
    }
    
    /* Зона Dropzone */
    .drop-zone {
      border: 2px dashed #3b3e45;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #141517;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #5865f2;
      background: #18191c;
    }
    .drop-zone p {
      color: #909296;
      font-size: 15px;
    }

    .status-text {
      margin-top: 15px;
      font-size: 14px;
      color: #909296;
      text-align: center;
    }
    
    .result-input {
      width: 100%;
      background: #141517;
      border: 1px solid #373a40;
      color: #5865f2;
      padding: 10px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 14px;
      outline: none;
    }

    /* Футер */
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
    }
    .footer a {
      color: #909296;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover {
      color: #5865f2;
      text-decoration: underline;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Шапка: здесь можно заменить ссылку на картинку или вернуть эмодзи -->
    <header class="header">
      <a href="#" class="brand">
        <img src="https://raw.githubusercontent.com/nefryttttt/Napka/main/uploads/logo.png" alt="logo">
        <span>Napka</span>
      </a>
    </header>

    <!-- Основная карточка загрузки -->
    <main class="card">
      <h1 class="title">Загрузка файлов</h1>
      
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>Перетащите картинку сюда или нажмите для выбора</p>
      </div>
      
      <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(this.files[0])">

      <div id="status" class="status-text"></div>
      <div id="result"></div>
    </main>

    <!-- Футер с ссылкой на GitHub -->
    <footer class="footer">
      <a href="https://github.com/nefryttttt/Napka" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script>
    const API_URL = 'https://napka-api.vercel.app/api/upload';
    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) handleFile(files[0]);
    });

    async function handleFile(file) {
      if (!file) return;

      const status = document.getElementById('status');
      const result = document.getElementById('result');
      status.innerText = 'Загрузка...';
      result.innerHTML = '';

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Content = reader.result.split(',')[1];
        const filename = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;

        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: filename,
              content: base64Content
            })
          });

          const data = await res.json();

          if (res.ok && data.url) {
            status.innerText = 'Загрузка завершена!';
            result.innerHTML = `
              <input type="text" class="result-input" value="${data.url}" readonly onclick="this.select(); document.execCommand('copy'); alert('Ссылка скопирована!');">
            `;
          } else {
            status.innerText = 'Ошибка: ' + (data.error || 'Не удалось загрузить');
          }
        } catch (err) {
          status.innerText = 'Сетевая ошибка: ' + err.message;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
