<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: rgba(22, 27, 46, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .background-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.05) 50%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #fff;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        main {
            width: 100%;
            max-width: 650px;
            margin: auto 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: all 0.3s ease;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.01);
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--primary);
            transition: transform 0.2s ease;
        }

        .upload-area:hover .upload-icon {
            transform: translateY(-4px);
        }

        .upload-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .hotkey-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #d1d5db;
        }

        kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        .loading-state, .result-state {
            display: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--success);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .reset-btn:hover {
            color: #fff;
        }

        .preview-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .preview-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            flex-shrink: 0;
            background: #000;
        }

        .link-details {
            flex-grow: 1;
        }

        .input-group-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .url-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .copied-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .copied-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .preview-container {
                flex-direction: column;
                align-items: stretch;
            }
            .preview-img {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <header>
        <a href="#" class="logo">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            Napka 
        </a>
    </header>

    <main>
        <div class="card">
            <!-- Зона загрузки -->
            <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <div class="upload-title">Перетащите картинку сюда</div>
                <div class="upload-desc">или нажмите, чтобы выбрать файл</div>
                <div class="hotkey-badge">
                    Вставьте из буфера: <kbd>Ctrl</kbd> + <kbd>V</kbd>
                </div>
                <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>

            <!-- Индикатор загрузки -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <div style="text-align: center; font-weight: 500;">Обработка файла...</div>
            </div>

            <!-- Результат -->
            <div class="result-state" id="resultState">
                <div class="result-header">
                    <div class="status-badge">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Готово!
                    </div>
                    <button class="reset-btn" onclick="resetUpload()">+ Загрузить ещё</button>
                </div>

                <div class="preview-container">
                    <img src="" id="previewImg" class="preview-img" alt="Превью">
                    <div class="link-details">
                        <div class="input-group-title">Ссылка на изображение</div>
                        <div class="input-row">
                            <input type="text" id="directUrl" class="url-input" readonly>
                            <button class="copy-btn" onclick="copyUrl()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                Копировать
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="copied-toast" id="toast">Ссылка скопирована в буфер!</div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const loadingState = document.getElementById('loadingState');
        const resultState = document.getElementById('resultState');
        const toast = document.getElementById('toast');

        // Drag & Drop события
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                processUpload(files[0]);
            }
        });

        // Вставка по Ctrl+V
        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    processUpload(file);
                    break;
                }
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) processUpload(file);
        }

        // Автономная обработка картинки прямо в браузере (без внешних серверов)
        function processUpload(file) {
            dropZone.style.display = 'none';
            loadingState.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                setTimeout(() => {
                    showResult(base64Url);
                }, 400);
            };
            reader.onerror = function() {
                alert('Ошибка чтения файла.');
                resetUpload();
            };
            reader.readAsDataURL(file);
        }

        function showResult(url) {
            loadingState.style.display = 'none';
            resultState.style.display = 'block';

            document.getElementById('previewImg').src = url;
            document.getElementById('directUrl').value = url;

            copyUrl(false);
        }

        function copyUrl(showToast = true) {
            const input = document.getElementById('directUrl');
            input.select();
            navigator.clipboard.writeText(input.value);

            if (showToast) {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }
        }

        function resetUpload() {
            resultState.style.display = 'none';
            dropZone.style.display = 'block';
            document.getElementById('fileInput').value = '';
        }
    </script>
</body>
</html>
